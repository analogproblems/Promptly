[package]
name = "promptly-ssh"
description = "SSH connections for Promptly: auth, shells, forwards, SFTP and host keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
promptly-term = { workspace = true }
promptly-session = { workspace = true }
# ring rather than aws-lc: pure-ish Rust, cross-compiles to Android and Windows without cmake.
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
promptly-vault = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "net", "time", "macros", "fs"] }
rand = "0.10"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
portable-pty = "0.9.0"
