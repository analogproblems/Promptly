[package]
# Underscored on purpose: cargokit and the Dart loader use the package name as the library file stem.
name = "promptly_api"
description = "The flutter_rust_bridge surface of the Promptly engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
promptly-term = { workspace = true }
promptly-ssh = { workspace = true }
promptly-vault = { workspace = true }
promptly-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
promptly-session = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time"] }
anyhow = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

# The frb attribute macro expands a `cfg(frb_expand)` probe; tell rustc it is expected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
