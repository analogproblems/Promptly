[package]
name = "promptly-cli"
description = "Command-line companion to Promptly: inspect, export, import and sync a vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "promptly"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
promptly-vault = { workspace = true }
promptly-ssh = { workspace = true }
