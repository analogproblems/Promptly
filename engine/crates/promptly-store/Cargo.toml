[package]
name = "promptly-store"
description = "Local state for Promptly: the materialised SQLite view and platform secret storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
promptly-vault = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
hkdf = "0.13"
sha2 = "0.11"

# The database is SQLCipher, built from source. Apple platforms use the
# system's own crypto library; everywhere else OpenSSL is built from source
# too, so no platform needs it installed.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
