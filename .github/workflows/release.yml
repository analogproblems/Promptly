# A tag such as v1.0.1 builds every free channel's package and opens a
# draft GitHub Release holding them, with notes from CHANGELOG.md. Publish
# the draft once the builds have been tried. See docs/DISTRIBUTION.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package
        run: tools/package-linux.sh app/build/linux/x64/release/bundle "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          tools/windows-runtime.ps1 app/build/windows/x64/runner/Release
          Copy-Item LICENSE app/build/windows/x64/runner/Release/LICENSE.txt
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "dist/promptly-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK and bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android NDK and platform
        # The runner image carries the SDK; add the versions Flutter's Gradle
        # plugin asks for. cargokit builds the Rust engine with this NDK.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Upload key, when the secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/android/upload.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > android/key.properties
            echo "Signing with the upload key."
          else
            echo "No keystore secret: signing with the debug key."
          fi
      - name: Build
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/promptly-$version-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../dist/promptly-$version-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # A release build is universal, so cargokit builds the engine for both.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Package
        run: tools/package-macos.sh app/build/macos/Build/Products/Release/promptly.app "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [linux, windows, android, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          version="${GITHUB_REF_NAME#v}"
          # The changelog section for this version, up to the next heading.
          awk -v v="$version" '
            $0 ~ "^## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version." > notes.md; fi
          cat >> notes.md <<'TXT'

          ---

          **Installing.** Linux: the `.deb` installs with your package manager, or unpack the tarball and run `./promptly`. Windows: unzip and run `promptly.exe`; the first run shows SmartScreen's "Windows protected your PC" because the build is not signed with a bought certificate, and *More info*, then *Run anyway*, gets past it. The zip carries the Microsoft C++ runtime it needs; if Windows still reports a missing `.dll`, install [the Visual C++ Redistributable (x64)](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist) once. macOS: open the `.dmg` and drag Promptly to Applications; the first launch is blocked because the build is not signed with an Apple Developer ID, so open System Settings, then Privacy & Security, click *Open Anyway* next to the line about Promptly and confirm with your password (once). Android: open the `.apk` on the phone and allow installing from that app when asked. `SHA256SUMS` lets you check a download.
          TXT
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Promptly ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
